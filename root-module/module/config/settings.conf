# Cài đặt của module / Module settings.
# Tệp này được nạp (source) bởi các script, nên chỉ ghi dạng key="value".
# Nên chỉnh qua WebUI; nếu sửa tay, hãy khởi động lại AdGuardHome sau đó.

# Ngôn ngữ WebUI và thông báo: vi (Tiếng Việt) | en (English)
language="vi"

# Chuyển hướng DNS (cổng 53) của máy sang AdGuardHome bằng iptables
# Redirect the device's DNS traffic (port 53) to AdGuardHome with iptables
enable_iptables="true"

# Chặn DNS qua IPv6 để buộc dùng IPv4 (đi qua AdGuardHome). "false" = chuyển hướng IPv6 sang ::1
# Block IPv6 DNS so queries fall back to IPv4 (and AdGuardHome). "false" = redirect IPv6 to ::1
block_ipv6_dns="true"

# Cổng DNS của AdGuardHome (tự đồng bộ với dns.port trong AdGuardHome.yaml)
# AdGuardHome DNS port (kept in sync with dns.port in AdGuardHome.yaml)
redir_port="5591"

# Tự khởi động lại AdGuardHome nếu bị tắt bất ngờ; khi đó iptables bị gỡ để máy không mất mạng
# Restart AdGuardHome if it dies; iptables rules are removed meanwhile so the device keeps DNS
watchdog="true"

# Số giây tối đa chờ AdGuardHome sẵn sàng trước khi áp dụng iptables
# Max seconds to wait for AdGuardHome before applying iptables
startup_timeout="120"

# User/group chạy AdGuardHome; iptables dùng chúng để AdGuardHome không bị chuyển hướng vào chính nó
# User/group AdGuardHome runs as; iptables skips it so it is never redirected into itself
adg_user="root"
adg_group="net_raw"

# Bỏ qua chuyển hướng cho các địa chỉ/mạng đích hoặc nguồn (cách nhau bằng dấu cách)
# Addresses/subnets to leave alone, by destination or source (space separated)
ignore_dest_list=""
ignore_src_list=""

# Múi giờ cho nhật ký của AdGuardHome / Timezone used by AdGuardHome logs
timezone="Asia/Ho_Chi_Minh"
