# Cấu hình AdGuardHome mặc định của module / Default AdGuardHome config of the module.
# - Bảng điều khiển chỉ lắng nghe trên 127.0.0.1 (không lộ ra mạng LAN).
# - Mật khẩu ban đầu là hash của một chuỗi ngẫu nhiên không ai biết: bảng điều khiển
#   AdGuardHome bị khóa cho tới khi bạn đặt mật khẩu trong WebUI của module.
http:
  pprof:
    port: 6060
    enabled: false
  address: 127.0.0.1:3000
  session_ttl: 720h
users:
  - name: admin
    password: $2a$10$Vz7EEh8itLl8vcnAFFJHIuHY/teM5faQ4MNZ4ZxZ6RLB2cBkFlsci
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: vi
theme: auto
dns:
  bind_hosts:
    - 127.0.0.1
  port: 5591
  anonymize_client_ip: false
  ratelimit: 0
  refuse_any: true
  upstream_dns:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
  upstream_dns_file: ""
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
  fallback_dns:
    - https://8.8.8.8/dns-query
  upstream_mode: load_balance
  fastest_timeout: 1s
  upstream_timeout: 10s
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  cache_enabled: true
  cache_size: 16777216
  cache_optimistic: true
  enable_dnssec: false
  serve_plain_dns: true
  hostsfile_enabled: true
tls:
  enabled: false
querylog:
  enabled: true
  file_enabled: true
  interval: 24h
  size_memory: 1000
  ignored: []
statistics:
  enabled: true
  interval: 24h
  ignored: []
