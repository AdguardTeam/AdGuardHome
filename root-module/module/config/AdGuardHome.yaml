# Cấu hình AdGuardHome mặc định của module / Default AdGuardHome config of the module.
# - Bảng điều khiển chỉ lắng nghe trên 127.0.0.1 (không lộ ra mạng LAN).
# - Mật khẩu ban đầu là hash của một chuỗi ngẫu nhiên không ai biết: bảng điều khiển
#   AdGuardHome bị khóa cho tới khi bạn đặt mật khẩu trong WebUI của module.
http:
  pprof:
    port: 6060
    enabled: false
  address: 127.0.0.1:3000
  session_ttl: 720h
users:
